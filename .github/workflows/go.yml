name: Go

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Install dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...

  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    # Orders use transactions, so MongoDB must run as a replica set. Service
    # containers cannot pass --replSet, so start it here.
    - name: Start MongoDB replica set
      run: |
        docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
        for i in $(seq 1 30); do
          if docker exec mongo mongosh --quiet --eval "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"; then
            echo "MongoDB replica set is ready"; exit 0
          fi
          sleep 2
        done
        echo "MongoDB replica set did not become ready"; docker logs mongo; exit 1

    - name: Integration tests
      env:
        LUKA_TEST_MONGO_URI: mongodb://localhost:27017/?directConnection=true
      run: go test -tags integration -race ./...
