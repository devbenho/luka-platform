services:
  mongo:
    image: mongo:7
    # Orders use multi-document transactions, which need a replica set.
    # A single-node replica set is enough for local development.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once it
      # has a primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  app:
    image: golang:1.23
    working_dir: /app
    volumes:
      - .:/app
    command: go run ./cmd/api/main.go
    ports:
      - "2707:2707"
    environment:
      PORT: "2707"
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: luka
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (e.g. export JWT_SECRET=$(openssl rand -hex 32))}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
